<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Collage of photography, drawing, and art">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f1e8"/>
      <stop offset="1" stop-color="#efe3d3"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8a48f"/>
      <stop offset="1" stop-color="#8a9a7b"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#d4b483"/>
      <stop offset="1" stop-color="#c97c5d"/>
    </linearGradient>
    <linearGradient id="draw" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#b7c4a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a4636" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <g transform="translate(70 70) rotate(-2)">
      <rect width="360" height="470" rx="24" fill="#fffaf4"/>
      <rect x="18" y="18" width="324" height="360" rx="16" fill="url(#photo)"/>
      <circle cx="260" cy="110" r="52" fill="#f7f1e8" opacity=".75"/>
      <path d="M55 320 L150 230 L220 285 L305 185 L342 320 Z" fill="#5a4636" opacity=".22"/>
      <text x="24" y="430" font-size="28" fill="#5a4636" font-family="Georgia, serif">Photography</text>
    </g>
    <g transform="translate(430 40) rotate(2)">
      <rect width="320" height="420" rx="24" fill="#fffaf4"/>
      <rect x="18" y="18" width="284" height="310" rx="16" fill="url(#draw)"/>
      <g fill="none" stroke="#5a4636" stroke-width="5" opacity=".55">
        <ellipse cx="160" cy="150" rx="72" ry="88"/>
        <path d="M95 240 Q160 180 225 240"/>
        <path d="M120 120 Q160 95 200 120"/>
      </g>
      <text x="24" y="382" font-size="28" fill="#5a4636" font-family="Georgia, serif">Drawing</text>
    </g>
    <g transform="translate(760 85) rotate(-1)">
      <rect width="370" height="470" rx="24" fill="#fffaf4"/>
      <rect x="18" y="18" width="334" height="360" rx="16" fill="url(#paint)"/>
      <circle cx="120" cy="140" r="58" fill="#f7f1e8" opacity=".28"/>
      <circle cx="240" cy="220" r="74" fill="#a85d44" opacity=".22"/>
      <path d="M60 320 C140 250 220 360 310 270" stroke="#fffaf4" stroke-width="10" fill="none" opacity=".5"/>
      <text x="24" y="430" font-size="28" fill="#5a4636" font-family="Georgia, serif">Art &amp; Craft</text>
    </g>
    <g transform="translate(330 430) rotate(1.5)">
      <rect width="540" height="210" rx="24" fill="#fffaf4"/>
      <rect x="18" y="18" width="504" height="140" rx="16" fill="#f3e8db"/>
      <g stroke="#a85d44" stroke-width="4" fill="none" opacity=".7">
        <circle cx="110" cy="88" r="42"/><circle cx="110" cy="88" r="22"/>
        <path d="M210 46 L250 88 L210 130 L170 88 Z"/>
        <path d="M330 40 C360 88 360 88 330 136 C300 88 300 88 330 40 Z"/>
        <path d="M410 88 H490 M450 48 V128"/>
      </g>
      <text x="24" y="188" font-size="26" fill="#5a4636" font-family="Georgia, serif">Alpona &amp; handmade patterns</text>
    </g>
  </g>
</svg>
